name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app now imports server code typed against the generated
      # Prisma client, so generate before lint/test on a cold checkout.
      - name: Generate Prisma client
        run: pnpm --filter @group-expense-hub/db generate

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for web changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

      - name: Skip if no changes
        if: steps.filter.outputs.web == 'false'
        run: exit 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config.ts owns the full orchestration for this suite (test
      # db provisioning via globalSetup, starting the real web dev server via
      # webServer, then tearing it down) - this step only needs to trigger
      # it, matching how the suite runs locally.
      - name: Run web e2e tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  deploy-web:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for web changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

      - name: Skip if no changes
        if: steps.filter.outputs.web == 'false'
        run: exit 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @group-expense-hub/db generate

      # Pinned: unpinned installs silently pick up whatever is newest at CI
      # run time. vercel@58.x regressed output-file-tracing for pnpm
      # monorepos on Next 16 + Turbopack (ENOENT lstat on traced
      # @opentelemetry/api files during `vercel deploy --prebuilt`).
      # 55.0.0 is the last version confirmed working against this repo.
      - name: Install Vercel CLI
        run: pnpm install --global vercel@55.0.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
